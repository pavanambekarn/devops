{
    "Version": "2012-10-17",
    "Statement": [
        {
            "Action": [
                "s3:GetObject",
                "s3:ListBucket"
            ],
            "Resource": [
                "arn:aws:s3:::devsecops-*-artifact-bucket",
                "arn:aws:s3:::devsecops-*-artifact-bucket/*"
            ],
            "Effect": "Allow",
            "Sid": "AllowArtifactBucket"
        },
        {
            "Action": [
                "kms:CreateGrant",
                "kms:DescribeKey",
                "kms:Decrypt",
                "kms:ReplicateKey"
            ],
            "Resource": [
                "arn:aws:kms:*:098048619134:key/*"
            ],
            "Effect": "Allow",
            "Sid": "AllowPipelineKms"
        },
        {
            "Action": [
                "acm:AddTagsToCertificate",
                "acm:DeleteCertificate",
                "acm:DescribeCertificate",
                "acm:GetCertificate",
                "acm:ImportCertificate",
                "acm:RenewCertificate",
                "acm:RemoveTagsFromCertificate",
                "acm:UpdateCertificateOptions",
                "acm:RequestCertificate",
                "acm:ListCertificates"
            ],
            "Resource": "*",
            "Effect": "Allow",
            "Sid": "LimitedAcmPermissions"
        },
        {
            "Action": [
                "iam:GetRole",
                "iam:GetRolePolicy",
                "iam:GetPolicy",
                "iam:AttachRolePolicy",
                "iam:PassRole",
                "iam:DeleteRole",
                "iam:DetachRolePolicy",
                "iam:DeleteRolePolicy",
                "iam:PutRolePolicy",
                "iam:CreateRole",
                "iam:TagRole",
                "iam:UntagRole",
                "iam:CreateServiceLinkedRole",
                "iam:ListPolicyVersions",
                "iam:CreatePolicyVersion",
                "iam:DeletePolicyVersion",
                "iam:CreatePolicy",
                "iam:DeletePolicy",
                "iam:RemoveRoleFromInstanceProfile",
                "iam:DeleteInstanceProfile",
                "iam:CreateInstanceProfile",
                "iam:AddRoleToInstanceProfile",
                "iam:UpdateAssumeRolePolicy",
                "iam:GetInstanceProfile"
            ],
            "Effect": "Allow",
            "Sid": "LimitedIamPermissions",
            "NotResource": [
                "arn:aws:iam::*:role/bcbsa-*-saml-*"
            ]
        },
        {
            "Action": [
                "route53:ChangeResourceRecordSets",
                "route53:ChangeTagsForResource",
                "route53:CreateHealthCheck",
                "route53:DeleteHealthCheck",
                "route53:Get*",
                "route53:List*",
                "route53:UpdateHealthCheck",
                "shield:CreateProtection",
                "shield:DeleteProtection",
                "shield:Describe*",
                "shield:List*",
                "shield:TagResource",
                "shield:UntagResource",
                "shield:DisassociateHealthCheck",
                "shield:AssociateHealthCheck"
            ],
            "Resource": "*",
            "Effect": "Allow",
            "Sid": "LimitedRoute53Permissions"
        },
        {
            "Action": [
                "servicecatalog:DescribeProvisionedProduct",
                "servicecatalog:DescribeProvisioningArtifact",
                "servicecatalog:ListProvisioningArtifacts",
                "servicecatalog:ProvisionProduct",
                "servicecatalog:UpdateProvisionedProduct",
                "servicecatalog:TerminateProvisionedProduct",
                "servicecatalog:DescribeRecord"
            ],
            "Resource": "*",
            "Effect": "Allow",
            "Sid": "ServiceCatalogProvisionProducts"
        },
        {
            "Action": [
                "acm-pca:*",
                "apigateway:*",
                "application-autoscaling:*",
                "applicationinsights:*",
                "athena:*",
                "autoscaling:*",
                "autoscaling-plans:*",
                "budgets:*",
                "ce:*",
                "cloudformation:*",
                "cloudfront:*",
                "cloudwatch:*",
                "codebuild:*",
                "codecommit:*",
                "codestar:*",
                "config:*",
                "controltower:*",
                "dax:*",
                "directconnect:*",
                "dynamodb:*",
                "ec2-instance-connect:*",
                "ec2:*",
                "ecr:*",
                "ecs:*",
                "eks:*",
                "elasticbeanstalk:*",
                "elasticache:*",
                "elasticloadbalancing:*",
                "elasticmapreduce:*",
                "dms:*",
                "es:*",
                "events:*",
                "firehose:*",
                "glacier:*",
                "glue:*",
                "health:*",
                "kafka:*",
                "kinesis:*",
                "kms:*",
                "lambda:*",
                "lex:*",
                "logs:*",
                "mgh:*",
                "opsworks:*",
                "pipes:*",
                "ram:*",
                "redshift:*",
                "rds:*",
                "s3:*",
                "scheduler:*",
                "secretsmanager:*",
                "sms:*",
                "sns:*",
                "sqs:*",
                "ssm:*",
                "states:*",
                "storagegateway:*",
                "swf:*",
                "transfer:*",
                "waf-regional:*",
                "waf:*"
            ],
            "Resource": "*",
            "Effect": "Allow",
            "Sid": "AllowPermittedServices"
        }
    ]
}